[platformio]
src_dir = src
include_dir = include
test_dir = test_native

[env:native_app_config]
platform = native
test_framework = unity
test_build_src = yes
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Iinclude
  -Itest_native/shims
build_src_filter =
  -<*>
  +<AppConfig.cpp>
  +<ConfigStore.cpp>
  +<PortalConfigCodec.cpp>
  +<core/PortalRequestAuth.cpp>
  +<core/FirmwareUpdateCore.cpp>
  +<core/TimeZoneCore.cpp>
  +<core/UiText.cpp>
  +<core/WidgetConfigCore.cpp>
lib_deps =
  bblanchon/ArduinoJson@^6.21.5

[env:native_json]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<TransitJsonParsers.cpp>
  +<TransitCatalog.cpp>
  +<core/CatalogCore.cpp>
  +<core/StaticCatalogCore.cpp>
  +<core/UiText.cpp>
  +<core/WidgetConfigCore.cpp>
  +<core/WidgetCore.cpp>
lib_deps = bblanchon/ArduinoJson@^6.21.5
build_flags = -std=gnu++17
