<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-labelledby="title description">
  <title id="title">TransitInk OS</title>
  <desc id="description">電子紙畫面內連接三個交通節點，末端以箭嘴表示前進方向。</desc>
  <style>
    .ink {
      fill: #151c24;
      stroke: #151c24;
    }

    .screen {
      fill: #eef2f5;
      stroke: #151c24;
    }

    .muted {
      fill: #66717d;
    }

    .accent {
      fill: #309fd4;
      stroke: #247ca8;
    }

    @media (prefers-color-scheme: dark) {
      .ink {
        fill: #edf3f8;
        stroke: #edf3f8;
      }

      .screen {
        fill: #1d2731;
        stroke: #edf3f8;
      }

      .muted {
        fill: #9ca9b5;
      }

      .accent {
        fill: #69bce5;
        stroke: #8acced;
      }
    }
  </style>

  <g transform="translate(2 5)">
    <rect class="screen" x="1.5" y="1.5" width="68" height="51" rx="8" stroke-width="3"/>

    <g class="muted" opacity=".32">
      <circle cx="10" cy="11" r="1.3"/>
      <circle cx="16" cy="11" r="1.3"/>
      <circle cx="22" cy="11" r="1.3"/>
      <circle cx="10" cy="17" r="1.3"/>
      <circle cx="16" cy="17" r="1.3"/>
      <circle cx="22" cy="17" r="1.3"/>
      <circle cx="10" cy="41" r="1.3"/>
      <circle cx="16" cy="41" r="1.3"/>
      <circle cx="22" cy="41" r="1.3"/>
      <circle cx="10" cy="47" r="1.3"/>
      <circle cx="16" cy="47" r="1.3"/>
      <circle cx="22" cy="47" r="1.3"/>
    </g>

    <path class="ink" d="M2 20h12v-5h8v3h10l5 6-4 3-4-5h-8v3h-7v-2H2z" stroke="none"/>
    <path class="ink" d="M40 33l5 6h8v-3h7v3h8v-5l11 9-11 9v-5h-8v3h-8v-3H42l-7-9z" stroke="none"/>

    <circle class="screen" cx="20" cy="20" r="7.5" stroke-width="2"/>
    <circle class="accent" cx="39" cy="31" r="7.5" stroke-width="1.5"/>
    <circle class="screen" cx="59" cy="43" r="7.5" stroke-width="2"/>
  </g>

  <text
    class="ink"
    x="94"
    y="42"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="31"
    font-weight="610"
    letter-spacing="-1.15"
    stroke="none"
  >TransitInk OS</text>
</svg>
