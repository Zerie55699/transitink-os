<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TransitInk OS Installer</title>
    <meta
      name="description"
      content="使用 Web Serial 將 TransitInk OS 安裝到 Zectrix Note 4。"
    >
    <script type="importmap">
      {
        "imports": {
          "https://unpkg.com/esp-web-tools@10.2.1/dist/web/index-Dt9w-IG1.js?module": "./esp-web-tools/no-port-dialog-zh.js"
        }
      }
    </script>
    <script
      type="module"
      src="https://unpkg.com/esp-web-tools@10.2.1/dist/web/install-button.js?module"
    ></script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #20201d;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      main {
        width: min(720px, 100%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 18px;
        max-width: 58ch;
        color: #4f514d;
        font-size: 1rem;
        line-height: 1.65;
      }

      .panel {
        border: 1px solid #d7d7cf;
        border-radius: 8px;
        background: #ffffff;
        padding: 22px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 6%);
      }

      .meta {
        margin-top: 18px;
        font-size: 0.9rem;
      }

      esp-web-install-button {
        --esp-tools-button-color: #1f6feb;
        --esp-tools-button-text-color: #ffffff;
        --esp-tools-button-border-radius: 6px;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        background: #1f6feb;
        color: #ffffff;
        padding: 0 18px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #171814;
          color: #f5f4ef;
        }

        p {
          color: #c7c7bf;
        }

        .panel {
          border-color: #363831;
          background: #20221d;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TransitInk OS Installer</h1>
      <p>使用桌面 Chrome、Edge 或支援 Web Serial 的瀏覽器，連接 Zectrix Note 4 後安裝 TransitInk OS。</p>
      <section class="panel" aria-label="TransitInk OS 韌體安裝器">
        <esp-web-install-button manifest="./manifest.json">
          <button slot="activate">安裝 TransitInk OS</button>
          <p slot="unsupported">此瀏覽器未支援 Web Serial，請改用桌面 Chrome 或 Edge。</p>
          <p slot="not-allowed">此安裝器需要以 HTTPS 或 localhost 開啟。</p>
        </esp-web-install-button>
        <p class="meta">
          版本：<span id="firmware-version">正在讀取…</span>。安裝會清除裝置上的現有設定及覆蓋 firmware；如找不到裝置，請按住 BOOT 再重新連接。
        </p>
      </section>
    </main>
    <script type="module">
      const version = document.querySelector("#firmware-version");
      try {
        const response = await fetch("./manifest.json", { cache: "no-store" });
        if (!response.ok) throw new Error("manifest unavailable");
        const manifest = await response.json();
        version.textContent = manifest.version || "未知";
      } catch {
        version.textContent = "未能讀取";
      }
    </script>
  </body>
</html>
