name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned tools
        run: scripts/install_tools.sh

      - name: Audit Python build tools
        run: scripts/audit_python_tools.sh

      - name: Verify pinned Traditional Chinese glyph data
        run: .venv/bin/python scripts/generate_hk_glyph_font.py --check

      - name: Verify embedded transit catalog
        run: .venv/bin/python scripts/generate_transit_route_catalog.py --check

      - name: Run tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -q

      - name: Build ESP32-S3 firmware
        run: PLATFORMIO_CORE_DIR="$PWD/.platformio" .venv/bin/platformio run -e zectrix_note4

      - name: Run high-severity static analysis
        run: PLATFORMIO_CORE_DIR="$PWD/.platformio" .venv/bin/platformio check -e zectrix_note4 --fail-on-defect high

      - name: Verify installer release package
        run: PLATFORMIO_CORE_DIR="$PWD/.platformio" .venv/bin/python scripts/package_installer.py

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
