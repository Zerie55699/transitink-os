name: Release firmware and installer

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned tools
        run: scripts/install_tools.sh

      - name: Audit Python build tools
        run: scripts/audit_python_tools.sh

      - name: Verify generated source and catalog
        run: |
          .venv/bin/python scripts/generate_hk_glyph_font.py --check
          .venv/bin/python scripts/generate_transit_route_catalog.py --check

      - name: Run tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -q

      - name: Build ESP32-S3 firmware
        run: PLATFORMIO_CORE_DIR="$PWD/.platformio" .venv/bin/platformio run -e zectrix_note4

      - name: Run high-severity static analysis
        run: PLATFORMIO_CORE_DIR="$PWD/.platformio" .venv/bin/platformio check -e zectrix_note4 --fail-on-defect high

      - name: Build versioned installer package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PLATFORMIO_CORE_DIR="$PWD/.platformio" \
            .venv/bin/python scripts/package_installer.py \
            --expected-version "${RELEASE_TAG#v}"

      - name: Upload verified installer package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-site
          path: dist/installer
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download verified installer package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-site
          path: dist/installer

      - name: Attest firmware build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/installer/firmware/*.bin
            dist/installer/*.zip
            dist/installer/SHA256SUMS.txt
            dist/installer/release-metadata.json
            dist/installer/legal/LICENSE.txt
            dist/installer/legal/THIRD_PARTY_NOTICES.md
            dist/installer/legal/THIRD_PARTY_DATA.md
            dist/installer/legal/CORRESPONDING_SOURCE.md

      - name: Publish GitHub Release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/installer/firmware/*.bin \
              dist/installer/*.zip \
              dist/installer/SHA256SUMS.txt \
              dist/installer/release-metadata.json \
              dist/installer/legal/LICENSE.txt \
              dist/installer/legal/THIRD_PARTY_NOTICES.md \
              dist/installer/legal/THIRD_PARTY_DATA.md \
              dist/installer/legal/CORRESPONDING_SOURCE.md \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/installer/firmware/*.bin \
              dist/installer/*.zip \
              dist/installer/SHA256SUMS.txt \
              dist/installer/release-metadata.json \
              dist/installer/legal/LICENSE.txt \
              dist/installer/legal/THIRD_PARTY_NOTICES.md \
              dist/installer/legal/THIRD_PARTY_DATA.md \
              dist/installer/legal/CORRESPONDING_SOURCE.md \
              --title "TransitInk OS $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download verified installer package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-site
          path: dist/installer

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload installer site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/installer

      - name: Deploy installer site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
