name: Release firmware and installer

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned tools
        run: scripts/install_tools.sh

      - name: Audit Python build tools
        run: scripts/audit_python_tools.sh

      - name: Verify generated source and catalog
        run: |
          .venv/bin/python scripts/generate_hk_glyph_font.py --check
          .venv/bin/python scripts/generate_transit_route_catalog.py --check

      - name: Run tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -q

      - name: Build ESP32-S3 firmware
        run: PLATFORMIO_CORE_DIR="$PWD/.platformio" .venv/bin/platformio run -e zectrix_note4

      - name: Run high-severity static analysis
        run: PLATFORMIO_CORE_DIR="$PWD/.platformio" .venv/bin/platformio check -e zectrix_note4 --fail-on-defect high

      - name: Build versioned installer package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PLATFORMIO_CORE_DIR="$PWD/.platformio" \
            .venv/bin/python scripts/package_installer.py \
            --expected-version "${RELEASE_TAG#v}"

      - name: Upload verified installer package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-site
          path: dist/installer
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download verified installer package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-site
          path: dist/installer

      - name: Attest firmware build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/installer/firmware/*.bin
            dist/installer/*.zip
            dist/installer/SHA256SUMS.txt
            dist/installer/release-metadata.json
            dist/installer/legal/LICENSE.txt
            dist/installer/legal/THIRD_PARTY_NOTICES.md
            dist/installer/legal/THIRD_PARTY_DATA.md
            dist/installer/legal/CORRESPONDING_SOURCE.md

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/installer/firmware/*.bin \
              dist/installer/*.zip \
              dist/installer/SHA256SUMS.txt \
              dist/installer/release-metadata.json \
              dist/installer/legal/LICENSE.txt \
              dist/installer/legal/THIRD_PARTY_NOTICES.md \
              dist/installer/legal/THIRD_PARTY_DATA.md \
              dist/installer/legal/CORRESPONDING_SOURCE.md \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/installer/firmware/*.bin \
              dist/installer/*.zip \
              dist/installer/SHA256SUMS.txt \
              dist/installer/release-metadata.json \
              dist/installer/legal/LICENSE.txt \
              dist/installer/legal/THIRD_PARTY_NOTICES.md \
              dist/installer/legal/THIRD_PARTY_DATA.md \
              dist/installer/legal/CORRESPONDING_SOURCE.md \
              --title "TransitInk OS $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download verified installer package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-site
          path: dist/installer

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload installer site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/installer

      - name: Deploy installer site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
