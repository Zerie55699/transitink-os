name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions: {}

jobs:
  analyze-cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned tools
        run: scripts/install_tools.sh

      - name: Build firmware for analysis
        env:
          PLATFORMIO_CORE_DIR: ${{ runner.temp }}/platformio
          PLATFORMIO_WORKSPACE_DIR: ${{ runner.temp }}/transitink-pio
        run: .venv/bin/platformio run -e zectrix_note4

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
